<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Налаштування</title>
<link href="https://fonts.googleapis.com/css?family=Nunito:400,700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #d3d3d3;
        font-family: 'Nunito', sans-serif;
    }

    .container {
        margin: 20px 40px;
        background: #e4e4e4;
        border: 1px solid #444;
        padding: 20px 30px 40px 30px;
        min-height: 80vh;
    }

    .top-bar {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .back-btn {
        cursor: pointer;
        font-size: 26px;
        font-weight: bold;
    }

    .title {
        font-size: 46px;
        font-weight: bold;
    }

    /* Основний блок налаштувань */
    .settings-block {
        background: #ececec;
        padding: 24px;
        border-radius: 12px;
        border: 2px solid #777;
    }

    .setting-item {
        margin-bottom: 24px;
    }

    .setting-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .setting-description {
        font-size: 15px;
        opacity: 0.8;
        margin-bottom: 12px;
    }

    search {
        width: 200px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #777;
        background: #f7f7f7;
        font-size: 16px;
        margin-top: 6px;
    }

    .save-btn {
        display: block;
        margin: 20px auto 0 auto;
        padding: 12px 32px;
        font-size: 18px;
        font-weight: bold;
        background: #c6e7c6;
        border: 1px solid #4f7f4f;
        border-radius: 10px;
        cursor: pointer;
    }

    .save-btn:hover {
        background: #bde0bd;
    }

</style>
</head>

<body>

<div class="container">

   <!-- Верхня панель -->
<div class="top-bar">

    <div class="back-btn" onclick="history.back()">←</div>

    <div class="title" th:text="#{settings.title}"></div>

</div>


<div class="settings-block">


    <div class="setting-item">

        <div class="setting-title"
             th:text="#{settings.theme.title}">
        </div>

        <div class="setting-description"
             th:text="#{settings.theme.description}">
        </div>

        <select>

            <option th:text="#{settings.theme.light}"></option>

            <option th:text="#{settings.theme.dark}"></option>

        </select>

    </div>



    <!-- Мова -->

    <div class="setting-item">

        <div class="setting-title"
             th:text="#{settings.language.title}">
        </div>

        <div class="setting-description"
             th:text="#{settings.language.description}">
        </div>

        <select>

            <option th:text="#{settings.language.ukrainian}"></option>

            <option th:text="#{settings.language.english}"></option>

        </select>

    </div>



    <div class="setting-item">

        <div class="setting-title"
             th:text="#{settings.password.title}">
        </div>

        <div class="setting-description"
             th:text="#{settings.password.description}">
        </div>

        <input type="password"
               th:placeholder="#{settings.password.placeholder}"
               style="padding: 10px; width: 100%; border:1px solid #777; border-radius:8px; background:#f7f7f7; font-size:16px;">

    </div>



    <button class="save-btn"
            th:text="#{settings.save}">
    </button>


</div>

</div>

</body>
</html>
